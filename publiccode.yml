  en:
    genericName: A12 Low Code
    shortDescription: AI Low Code Platform for digital administrative services in the public sector
    longDescription: |
      The **A12 AI Low Code Platform** is built on the concept of model-driven
      software engineering (MDSE), applying the low-code principle to the
      development of public sector applications of all kinds – from application
      portals and online services to digital register solutions and complex
      domain-specific case processing systems.

      **A12 is designed as an open platform**, providing broad flexibility for the
      development as well as the long-term maintenance and evolution of custom
      software. Domain experts and business analysts can model the functional core
      of the software themselves using modeling tools. The principle is
      "Data First" – modeling starts with data structures, not with the UI. The
      consistent separation of domain logic and technology makes it possible to
      preserve the functional core even across technology transitions. Domain
      models can be reused across applications and have proven themselves over
      several generations of technology.

      **Proven in mission-critical environments**: A12 has formed the technical
      backbone of [ELSTER](https://www.elster.de) for more than 10 years. Using
      A12, domain experts in the tax administration model validation rules and
      calculations for more than 1,000 tax models themselves and update them
      without any developer involvement. ELSTER is used by more than 25 million
      people today and meets the highest requirements for availability,
      performance and security.

      A12 specifically supports the implementation of requirements in the areas of
      **data protection, compliance and IT security** as well as applicable
      **accessibility** requirements ([WCAG 2.2](https://www.w3.org/TR/WCAG22/),
      [BITV 2.0](https://www.gesetze-im-internet.de/bitv_2_0/)) and the service
      standard of the BMDS
      [DIN SPEC 66366](https://servicestandard.gov.de).

      The **Enterprise Edition** adds extended capabilities: **AI features** can be
      used both within the application itself and for **AI-assisted development**
      (Agentic Coding). The Enterprise Edition provides defined vendor support
      with SLA.

      Further information:
      - [General overview of A12](https://a12.ai)
      - [Introduction video](https://vimeo.com/1194015604)
      - [GetA12 – Technical documentation](https://geta12.com)
      - [A12 Platform Code](https://github.com/mgm-tp)
      - [Release overview](https://geta12.com/#/releases/releases-overview)
      - [Release lines & support periods](https://geta12.com/#/releases/release-lines)

      A12 is available under a dual license: open source under
      [EUPL-1.2](https://eupl.eu/1.2/en/) and commercially for extended
      Enterprise features.
      Details on [editions and licensing](https://geta12.com/#/editions-licensing).
    features:
      - Data and UI modeling without programming knowledge
      - Creation of simple to highly complex online forms
      - Powerful rule language for validations and calculations
      - Workflow support based on the BPMN standard
      - Mapping Model for model-driven data integration from multiple sources
      - Business Scripting (preview) — TypeScript-based business logic, enabling non-developers to extend models
      - Plasma design system — WCAG 2.2 compliant, BITV 2.0, EAA-ready out-of-the-box
      - Extensibility at all levels through numerous extension points
      - Print system for generating accessible PDFs (Enterprise Edition)
      - A12 AI Plugin Marketplace — agents and skills for modeling and development in Claude Code (Enterprise Edition)
      - Binding LLMs at model level produces deterministic code (Enterprise Edition)
      - Containerization with Helm charts and CI/CD pipelines (Enterprise Edition)
      - Models outlive technology generations — the domain core is preserved across technology transitions
    documentation: 'https://geta12.com'
    apiDocumentation: 'https://geta12.com/#/docs/latest/latest/overall/a12_development'
