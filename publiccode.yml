  fr:
    genericName: A12 Low Code
    shortDescription: Plateforme low-code IA pour les services numériques de l'administration publique
    longDescription: |
      La **plateforme low-code A12 AI** repose sur le concept de l'ingénierie
      logicielle pilotée par les modèles (MDSE), et applique le principe du
      low-code au développement d'applications du secteur public de toute
      nature – des portails de demande en ligne aux services en ligne, en
      passant par les solutions de registres numériques et les processus
      métier complexes.

      **A12 est conçue comme une plateforme ouverte**, offrant une grande
      flexibilité pour le développement ainsi que pour la maintenance et
      l'évolution à long terme de logiciels sur mesure. Les expert·es métier
      et les analystes fonctionnels peuvent modéliser eux-mêmes le cœur
      fonctionnel du logiciel à l'aide d'outils de modélisation. Le principe
      est le suivant : « Data First » – la modélisation commence par les
      structures de données, et non par l'interface utilisateur. La séparation
      stricte entre la logique métier et la technologie permet de préserver
      le cœur fonctionnel même lors de transitions technologiques majeures.
      Les modèles métier sont réutilisables entre applications et ont fait
      leurs preuves sur plusieurs générations technologiques.

      **Éprouvée dans des environnements critiques** : A12 constitue depuis
      plus de 10 ans le socle technique d'[ELSTER](https://www.elster.de).
      Grâce à A12, les expert·es métier de l'administration fiscale modélisent
      eux-mêmes les règles de validation et les calculs de plus de 1 000
      modèles fiscaux et les mettent à jour sans intervention de développeurs.
      ELSTER est utilisé aujourd'hui par plus de 25 millions de personnes et
      répond aux exigences les plus strictes en matière de disponibilité, de
      performance et de sécurité.

      A12 prend spécifiquement en charge la mise en œuvre des exigences dans
      les domaines de la **protection des données, de la conformité et de la
      sécurité informatique**, ainsi que des exigences applicables en matière
      d'**accessibilité** ([WCAG 2.2](https://www.w3.org/TR/WCAG22/),
      [BITV 2.0](https://www.gesetze-im-internet.de/bitv_2_0/)) et du standard
      de service du BMDS [DIN SPEC 66366](https://servicestandard.gov.de).

      L'**édition Enterprise** ajoute des fonctionnalités étendues : les
      **fonctions d'IA** peuvent être utilisées à la fois au sein de
      l'application elle-même et pour le **développement assisté par IA**
      (Agentic Coding). L'édition Enterprise inclut un support éditeur défini
      avec SLA.

      Pour en savoir plus :
      - [Présentation générale d'A12](https://a12.ai)
      - [Vidéo d'introduction](https://vimeo.com/1194015604)
      - [GetA12 – Documentation technique](https://geta12.com)
      - [Code de la plateforme A12](https://github.com/mgm-tp)
      - [Aperçu des versions](https://geta12.com/#/releases/releases-overview)
      - [Lignes de version et périodes de support](https://geta12.com/#/releases/release-lines)

      A12 est disponible sous double licence : open source sous
      [EUPL-1.2](https://eupl.eu/1.2/fr/) et commerciale pour les
      fonctionnalités Enterprise étendues.
      Détails sur les [éditions et licences](https://geta12.com/#/editions-licensing).
    features:
      - Modélisation des données et de l'interface utilisateur sans connaissances en programmation
      - Création de formulaires en ligne simples à hautement complexes
      - Langage de règles puissant pour les validations et les calculs
      - Prise en charge des workflows selon le standard BPMN
      - Mapping Model pour l'intégration de données pilotée par les modèles à partir de sources multiples
      - Business Scripting (aperçu) — logique métier basée sur TypeScript, permettant aux non-développeurs d'étendre les modèles
      - Système de design Plasma — conforme WCAG 2.2, BITV 2.0, prêt pour l'EAA dès l'origine
      - Extensibilité à tous les niveaux grâce à de nombreux points d'extension
      - Système d'impression pour la génération de PDF accessibles (édition Enterprise)
      - A12 AI Plugin Marketplace — agents et skills pour la modélisation et le développement dans Claude Code (édition Enterprise)
      - La connexion de LLM au niveau du modèle produit un code déterministe (édition Enterprise)
      - Conteneurisation avec des charts Helm et des pipelines CI/CD (édition Enterprise)
      - Les modèles survivent aux générations technologiques — le cœur métier est préservé lors des transitions technologiques
