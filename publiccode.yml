description:
  de:
    genericName: A12 Low Code
    shortDescription: AI Low Code Platform für digitale Fachverfahren in der öffentlichen Verwaltung
    longDescription: |
      Die **A12 AI Low Code Platform** setzt auf das Konzept der modellgetriebenen
      Softwareentwicklung (MDSE) und erschließt damit das Low-Code-Prinzip zur
      Entwicklung behördlicher Anwendungen aller Art – vom Antragsportal über
      Online-Dienste und digitale Register-Lösungen bis zum komplexen Fachverfahren.

      **A12 ist als offene Plattform ausgelegt**, die große Flexibilität für die
      Entwicklung sowie die langfristige Pflege und Weiterentwicklung von
      Individualsoftware ermöglicht. Fachexpert:innen und Business-Analyst:innen können
      mit Modellierungswerkzeugen den fachlichen Kern der Software eigenständig
      abbilden. Das Prinzip: „Data First“ – Modellierung beginnt bei Datenstrukturen,
      nicht bei der UI. Die konsequente Trennung von Fachlichkeit und Technik ermöglicht
      es, auch bei Technologiewechseln den fachlichen Kern zu erhalten. Fachmodelle lassen
      sich anwendungsübergreifend einsetzen und haben sich über mehrere
      Technologiegenerationen hinweg erprobt.

      **Bewährt in hochkritischen Umgebungen**: A12 bildet seit über 10 Jahren das
      technische Rückgrat von [ELSTER](https://www.elster.de). Mit A12 modellieren
      Fachexpert:innen der Steuerverwaltung u. a. Validierungsregeln und Berechnungen
      für mehr als 1.000 Steuermodelle selbst und aktualisieren diese ohne
      Beteiligung von Entwickler:innen. ELSTER wird heute von mehr als 25 Millionen Anwendenden
      genutzt und erfüllt höchste Anforderungen an Verfügbarkeit, Performance und
      Sicherheit.

      A12 unterstützt gezielt die Umsetzung von Anforderungen in den Bereichen
      **Datenschutz, Compliance und IT-Sicherheit** sowie geltender Anforderungen
      zur **Barrierefreiheit** ([WCAG 2.2](https://www.w3.org/TR/WCAG22/),
      [BITV 2.0](https://www.gesetze-im-internet.de/bitv_2_0/)) und dem
      Service-Standard des BMDS
      [DIN-SPEC 66366](https://servicestandard.gov.de).

      Die **Enterprise Edition** fügt erweiterte Funktionen hinzu: **KI-Funktionen**
      lassen sich sowohl innerhalb der Anwendung als auch für **KI-gestützte
      Entwicklung** (Agentic Coding) nutzen. Die Enterprise Edition bietet
      definierten Hersteller-Support mit SLA.

      Weiterführende Informationen:
      - [Allgemeiner Überblick zu A12](https://a12.ai)
      - [Einführungs-Video](https://vimeo.com/1194015603)
      - [GetA12 – Technische Dokumentation](https://geta12.com)
      - [A12 Platform Code](https://github.com/mgm-tp)
      - [Release-Übersicht](https://geta12.com/#/releases/releases-overview)
      - [Release-Linien & Support-Zeiträume](https://geta12.com/#/releases/release-lines)

      A12 steht unter einer dualen Lizenz: Open Source unter
      [EUPL-1.2](https://eupl.eu/1.2/de/) sowie kommerziell für erweiterte
      Enterprise-Funktionen.
      Details zu [Editionen und Lizenzen](https://geta12.com/#/editions-licensing).
    features:
      - Daten- und UI-Modellierung ohne Programmierkenntnisse
      - Erstellung von einfachen bis hochkomplexen Online-Formularen
      - Mächtige Regelsprache für Validierungen und Berechnungen
      - Workflow-Unterstützung im BPMN-Standard
      - Mapping Model für modellgetriebene Datenintegration aus mehreren Quellen
      - Business Scripting (Vorschau) — TypeScript-basierte Geschäftslogik, ermöglicht auch Nicht-Entwickler:innen die Erweiterung von Modellen
      - Plasma-Designsystem — WCAG 2.2-konform, BITV 2.0, EAA-ready out-of-the-box
      - Erweiterbarkeit auf allen Ebenen durch zahlreiche Extension Points
      - Drucksystem für Generierung barrierefreier PDFs (Enterprise Edition)
      - A12 AI Plugin Marketplace — Agenten und Skills für Modellierung und Entwicklung in Claude Code (Enterprise Edition)
      - Anbindung von LLMs auf Modell-Ebene bringt deterministischen Code (Enterprise Edition)
      - Containerisierung mit Helm-Charts und CI/CD-Pipelines (Enterprise Edition)
      - Modelle überleben Technologiegenerationen — Fachkern bleibt bei Technologiewechsel erhalten
